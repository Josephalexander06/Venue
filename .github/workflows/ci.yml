name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: venue_test
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://venue:venue@localhost:5432/venue_test
      TEST_DATABASE_URL: postgres://venue:venue@localhost:5432/venue_test
      FRONTEND_URL: http://localhost:5173
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      SESSION_TTL_HOURS: "24"
      SEED_ADMIN_EMAIL: admin@college.edu
      SEED_ADMIN_PASSWORD: ChangeMeNow!2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://venue:venue@localhost:5432/venue_test
          SEED_ADMIN_EMAIL: admin@college.edu
          SEED_ADMIN_PASSWORD: ChangeMeNow!2026

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        env:
          DOMAIN: venue.example.edu
          POSTGRES_PASSWORD: ci-placeholder-password
        run: docker compose -f docker-compose.prod.yml config --quiet
